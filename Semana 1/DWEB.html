<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sala Táctica — Blog de Rainbow Six Siege (Bootstrap 3)</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#15181C;
    --panel:#1D2126;
    --line:#2C3138;
    --text:#E7E8E6;
    --muted:#9AA0A6;
    --accent:#E0522E;
  }
  body{ background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; }
  h1,h2,h3,.brand{ font-family:'Rajdhani',sans-serif; text-transform:uppercase; letter-spacing:.03em; }
  a{ color:var(--accent); }
  a:focus, button:focus, .navbar-nav>li>a:focus, input:focus{
    outline:3px solid var(--accent); outline-offset:2px;
  }

  .mb-0{ margin-bottom:0; }
  .mb-2{ margin-bottom:.6rem; }
  .mt-2{ margin-top:.6rem; }
  .my-4{ margin-top:1.5rem; margin-bottom:1.5rem; }
  .py-4{ padding-top:1.5rem; padding-bottom:1.5rem; }
  .py-5{ padding-top:3rem; padding-bottom:3rem; }
  .text-center{ text-align:center; }
  .flex-footer{ display:flex; flex-wrap:wrap; justify-content:space-between; }
  .flex-footer > *{ margin-right:.5rem; margin-bottom:.5rem; }

  .navbar-tactica{ background:var(--panel); border-bottom:2px solid var(--accent); border-radius:0; margin-bottom:0; }
  .navbar-tactica .navbar-brand{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:1.4rem; color:var(--text); text-transform:uppercase; letter-spacing:.03em; }
  .navbar-tactica .navbar-nav>li>a{ color:var(--text); }
  .navbar-tactica .navbar-nav>li>a:hover,
  .navbar-tactica .navbar-nav>li.active>a{ color:var(--accent); background:transparent; }
  .navbar-tactica .navbar-toggle .icon-bar{ background:var(--text); }
  .navbar-tactica .navbar-toggle{ border-color:var(--line); }
  .navbar-tactica .navbar-collapse{ border-color:var(--line); }

  .eyebrow{ color:var(--accent); font-size:.75rem; letter-spacing:.15em; text-transform:uppercase; font-weight:600; }
  .hero-title{ font-weight:700; font-size:2.6rem; }
  @media (max-width:767px){ .hero-title{ font-size:1.9rem; } }

  .post-card{ background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--accent); padding:1.4rem; margin-bottom:1.4rem; border-radius:0; }
  .post-card h2{ font-size:1.3rem; }
  .post-meta{ font-size:.8rem; color:var(--muted); }

  .widget{ background:var(--panel); border:1px solid var(--line); padding:1.2rem; margin-bottom:1.4rem; }
  .widget h3{ font-size:1rem; margin-bottom:.7rem; }
  .cat-list{ list-style:none; padding-left:0; }
  .cat-list li{ margin-bottom:.4rem; }
  .cat-list a{ color:var(--text); text-decoration:none; }
  .cat-list a:hover{ color:var(--accent); }

  .form-control{ background:var(--bg); border-color:var(--line); color:var(--text); box-shadow:none; }
  .form-control:focus{ background:var(--bg); color:var(--text); border-color:var(--accent); box-shadow:none; }

  .skeleton{ background:linear-gradient(90deg,#23272d 25%,#2c3138 37%,#23272d 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; }
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}

  .btn-outline-light{ background:transparent; border:1px solid var(--text); color:var(--text); }
  .btn-outline-light:hover{ background:var(--text); color:var(--bg); }

  footer{ background:var(--panel); border-top:1px solid var(--line); padding:2rem 0; margin-top:2.5rem; color:var(--muted); }
</style>
</head>
<body>

<nav class="navbar navbar-tactica navbar-static-top">
  <div class="container">
    <div class="navbar-header">
      <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Abrir navegación">
        <span class="sr-only">Abrir navegación</span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
      </button>
      <a class="navbar-brand" href="#">Sala Táctica</a>
    </div>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="nav navbar-nav navbar-right">
        <li class="active"><a href="#">Inicio <span class="sr-only">(actual)</span></a></li>
        <li><a href="#">Operadores</a></li>
        <li><a href="#">Mapas</a></li>
        <li><a href="#">Esports</a></li>
      </ul>
    </div>
  </div>
</nav>

<footer>
  <div class="container flex-footer">
    <p class="mb-0">© 2026 Sala Táctica</p>
    <a href="#">Contacto</a>
  </div>
</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/js/bootstrap.min.js"></script>

</body>
</html>
